name: Ventilation System CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # --- УНИВЕРСАЛЬНЫЙ ПОИСК И СБОРКА БЭКЕНДА ---
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install Backend Dependencies
      run: |
        # Ищем файл requirements.txt во всем репозитории
        REQ_PATH=$(find . -name "requirements.txt" | head -n 1)
        if [ -n "$REQ_PATH" ]; then
          echo "Нашел зависимости бэкенда в: $REQ_PATH"
          pip install -r "$REQ_PATH"
        else
          echo "Файл requirements.txt не найден!"
        fi

    # --- УНИВЕРСАЛЬНЫЙ ПОИСК И СБОРКА ФРОНТЕНДА ---
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Frontend Dependencies
      run: |
        # Ищем папку, где лежит package.json
        PACKAGE_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
        if [ -n "$PACKAGE_PATH" ]; then
          FRONT_DIR=$(dirname "$PACKAGE_PATH")
          echo "Нашел фронтенд в папке: $FRONT_DIR"
          cd "$FRONT_DIR"
          npm install
        else
          echo "Файл package.json не найден!"
          exit 1
        fi

    - name: Build Frontend
      env:
        CI: false
      run: |
        PACKAGE_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
        FRONT_DIR=$(dirname "$PACKAGE_PATH")
        cd "$FRONT_DIR"
        npm run build --if-present

    - name: Success Message
      run: echo "DONE"