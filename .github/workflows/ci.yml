name: Ventilation System CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: List files
      run: ls -R


    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install Backend Dependencies
      run: |
        # Проверяем, есть ли папка, прежде чем заходить
        if [ -d "backend" ]; then
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        else
          echo "Папка backend не найдена, пропускаем"
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Frontend Dependencies
      run: |
        if [ -d "frontend" ]; then
          cd frontend
          npm install
        else
          echo "Папка frontend не найдена, пропускаем"
        fi

    - name: Build Frontend
      env:
        CI: false
      run: |
        if [ -d "frontend" ]; then
          cd frontend
          npm run build
        fi

    - name: Success Message
      run: echo "Done"